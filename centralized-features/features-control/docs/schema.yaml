version: "1.0"

# Schema block hierarchy:
# autogenerated-central.yaml
# ├── metadata                          (fixed field)
# └── features__<source_file>.yaml      (dynamic key pattern)
#     ├── provenance_data               (source, git path, linkfile path)
#     ├── metadata                      (version, owner, notes)
#     └── features
#         └── <module_name>             (e.g. "fastmmi", "qnextgen_api_fwk")
#             └── <feature_name>        (e.g. "feature_fastmmi_charger")
#                 ├── description       (required)
#                 ├── feature_datatype  (boolean|integer|string)
#                 ├── feature_value     (cross-validated against datatype)
#                 ├── feature_scope     (make|native|java|runtime|all)
#                 ├── feature_class     (optional)
#                 ├── depends_on        (string expression)
#                 └── soc_overrides     (list of {soc_names|soc_ids, value})
# ── root ──────────────────────────────────────────────────────────────────────
root:
  unknown_fields: allow
  fields:
    metadata:
      doc: "Tool-generated central file metadata (version, generated_by, profile)."
      required: false
      type: mapping
      schema: central_metadata_schema
  dynamic_fields:
    - pattern: ".*features.*\\.yaml"
      type: mapping
      schema: file_section_schema

# ── central_metadata_schema ──────────────────────────────────────────────────
# Root-level metadata block, written by the centralization tool.
central_metadata_schema:
  unknown_fields: allow
  fields:
    generated_by:
      doc: "Name of the tool that generated this central file."
      required: false
      type: string
    profile:
      doc: "Build profile used when generating this central file."
      required: true
      type: string
    target:
      required: true
      type: string

# ── file_section_schema ───────────────────────────────────────────────────────
# One entry per source YAML file aggregated into the central file.
file_section_schema:
  unknown_fields: allow
  fields:
    provenance_data:
      doc: "Optional provenance metadata recording the source file path, git path, and manifest linkfile path."
      required: true
      type: mapping
      schema: provenance_schema
    metadata:
      doc: "File-level metadata for this fragment. version and owner are required."
      required: false
      type: mapping
      schema: file_metadata_schema
    features:
      doc: "Feature definitions grouped by module name. Each group maps feature names to their definitions."
      required: true
      type: mapping
      schema: module_section_schema

# ── module_section_schema ─────────────────────────────────────────────────────
# arbitrary module name (e.g. "fastmmi", "email").
module_section_schema:
  doc: "Represents a module under which various features can exist. Keys are arbitrary module names, e.g. fastmmi, email, qnextgen_api_fwk."
  unknown_fields: allow
  dynamic_fields:
    - pattern: ".*"            # accept any module name
      type: mapping
      schema: feature_group_schema

# ── provenance_schema ─────────────────────────────────────────────────────────
provenance_schema:
  unknown_fields: allow
  fields:
    source_file:
      doc: "Relative path of the source fragment YAML file within the workspace."
      required: false
      type: string
    module_git_path:
      doc: "Git repository path of the module that owns this fragment file."
      required: false
      type: string
    manifest_linkfile_path:
      doc: "Manifest linkfile path used to locate this fragment in the repo manifest."
      required: false
      type: string

# ── file_metadata_schema ──────────────────────────────────────────────────────
# Per-fragment metadata block, written by the feature file owner.
file_metadata_schema:
  unknown_fields: allow
  fields:
    version:
      doc: "Version of the fragment feature file."
      required: true
      type: string
    owner:
      doc: "Team or individual responsible for the feature definitions in this file."
      required: true
      type: string
    notes:
      doc: "Optional free-text notes about this file or its feature set."
      required: false
      type: string

# ── feature_group_schema ──────────────────────────────────────────────────────
# dynamic feature names in the form feature_<module>_<name>  (e.g. feature_email_enabled).
feature_group_schema:
  doc: "Under one module, various features can exist.
        Feature name format should be strictly of the form feature_<module>_<feature_name>.
        ex: feature_email_a here module name is email, and feature name is 'a'."
  unknown_fields:
    policy: error
    message: "Feature name must start with 'feature_' (expected format: feature_<module>_<name>)"
  dynamic_fields:
    - pattern: "feature.*"
      type: mapping
      schema: feature_schema

# ── feature_schema ────────────────────────────────────────────────────────────
feature_schema:
  unknown_fields: warning
  fields:
    description:
      doc: "Human-readable explanation of what the feature does."
      required: true
      type: string
      rules:
        - rule: non_empty
          level: warning
          message: "description should not be empty or whitespace-only"
      examples: ["The feature implements the email functionality"]

    feature_datatype:
      doc: "Declares the data type of the feature's value. Allowed: boolean, integer, string"
      required: true
      type: string
      rules:
        - rule: enum
          level: error
          values: ["boolean", "integer", "string"]
      examples:
        - boolean
        - integer

    feature_value:
      doc: "Configured value for the feature. Must match the declared type."
      required: true
      rules:
        - rule: type_matches_field
          level: error
          field: feature_datatype
      examples:
        - 3
        - true
        - "feature_value"

    feature_scope:
      doc: "List of layers/systems where this feature applies.
            native is for c/cpp.
            make is for make variables, can be used in Android.mk or product/board makefiles.
            java is for java files.
            runtime is to enable runtime api's framework so that the processes can use it for runtime feature capability queries.
            To enable all the scopes, we can give 'all' as a supported value. 'all' cannot be combined with other values."
      required: true
      type: list
      rules:
        - rule: list_items_enum
          level: error
          values: ["make", "native", "java", "runtime", "all"]
        - rule: exclusive_item
          level: error
          item: "all"
          message: "'all' must be the only item in the list when present"
      examples:
        - ["all"]
        - ["native", "java"]
        - ["make", "java"]
        - ["make", "java", "runtime"]

    feature_class:
      doc: "Categorizes the functional role of the feature. "
      required: false
      type: list
      rules:
        - rule: list_items_enum
          level: error
          values: ["boot_critical", "vsr_mandatory", "experimental"]
      examples:
        - ["boot_critical"]
        - ["boot_critical", "vsr_mandatory", "experimental"]

    process_info:
      doc: "List of process names that this feature is associated with (e.g. vendor.qti.email_service)."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: error
          item_type: string
      examples:
        - ["vendor.qti.email"]
        - ["vendor.qti.email_service", "vendor.qti.email_client"]

    binary_info:
      doc: "List of binary paths that this feature is delivered in (e.g. /vendor/bin/email)."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: error
          item_type: string
      examples:
        - ["/vendor/bin/email"]
        - ["/vendor/bin/email_test", "/vendor/bin/email_server"]

    prebuilt_modules:
      doc: "List of prebuilt module paths delivered by this feature (e.g. /vendor/lib/libfoo.so)."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: error
          item_type: string
      examples:
        - ["/vendor/lib/libfoo.so"]
        - ["/vendor/lib/libfoo.so", "/vendor/lib64/libfoo.so"]

    depends_on:
      doc: "Dependencies are mentioned in the form of an expression.
            Build fails if the expression evaluates to false.
            If the feature has no dependencies, this field MUST be explicitly set as null string.
            Paranthesis are mandatory for every sub-expression, and even for a single expression."
      required: false
      type: string
      examples:
        - ""
        - "((feature_email_a == true) && (feature_email_b == true))"
        - "(feature_email_a == true)"

    soc_overrides:
      doc: "It can be used to override the feature value with a different value based on the
            soc_name or per soc_id.
            Useful to differentiate the feature value among socs using the same lunch/binary.
            Use soc_name if applicable to all socs of the same name, else use socIds.
            soc_ids takes precedence/overrides the soc_name."
      required: false
      type: list
      rules:
        - rule: list_items_schema
          level: error
          item_schema: soc_override_schema

    doc_info:
      doc: "It can be used to provide the readme documentation path."
      required: false
      type: mapping
      schema: doc_info_schema

# ── soc_override_schema ───────────────────────────────────────────────────────
soc_override_schema:
  unknown_fields: warning
  fields:

    soc_names:
      doc: "SoC names List, for which the feature value can be overridden."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: error
          item_type: string
          message: "soc_names entries must be string"
      examples:
        - ["canoe", "alor"]

    soc_ids:
      doc: "SoC IDs list, for which the feature value can be overridden."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: error
          item_type: integer
          message: "soc_ids entries must be plain integers"
      examples:
        - [457, 458]
        - [458]

    value:
      doc: "Value to override. Must match the parent feature's feature_datatype."
      required: true
      rules:
        - rule: type_matches_field
          level: error
          field: feature_datatype
      examples:
        - true

  rules:
    - rule: at_least_one_of
      level: error
      fields: ["soc_names", "soc_ids"]
      message: "Each soc_override must specify either 'soc_names' or 'soc_ids'"

# ── doc_info_schema ───────────────────────────────────────────────────────────
doc_info_schema:
  unknown_fields: warning
  fields:

    readme_doc:
      doc: "Path to the readme doc from the workspace root."
      required: false
      type: string
      rules:
        - rule: non_empty
          level: warning
          message: "readme_doc path should not be empty if specified"
      examples: ["vendor/qcom/opensource/email/email_A_readme.md"]

    related_features:
      doc: "List of other related features, so that that info can be suggested for users."
      required: false
      type: list
      rules:
        - rule: list_items_type
          level: warning
          item_type: string
      examples:
        - ["feature_email_a"]
        - ["feature_email_a", "feature_email_b"]
